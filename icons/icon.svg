<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple gradient background -->
  <defs>
    <radialGradient id="purpleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b00e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d0052;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="sharinganGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#purpleGrad)" stroke="#400070" stroke-width="2"/>
  
  <!-- Stylized eye/sharingan symbol -->
  <ellipse cx="64" cy="64" rx="35" ry="38" fill="#1a0033" opacity="0.8"/>
  
  <!-- Eye white -->
  <ellipse cx="64" cy="64" rx="28" ry="30" fill="#ffffff"/>
  
  <!-- Iris (red for Sharingan) -->
  <circle cx="64" cy="64" r="18" fill="url(#sharinganGrad)"/>
  
  <!-- Pupil -->
  <circle cx="64" cy="64" r="8" fill="#000000"/>
  
  <!-- Sharingan tomoe (3 comma shapes) -->
  <g transform="translate(64, 64)">
    <!-- Tomoe 1 -->
    <path d="M 0,-12 Q 8,-12 10,-8 Q 12,-4 8,0 Q 6,2 2,2 Q 0,2 -2,0 L 0,-12 Z" 
          fill="#000000" opacity="0.9" transform="rotate(0)"/>
    <!-- Tomoe 2 -->
    <path d="M 0,-12 Q 8,-12 10,-8 Q 12,-4 8,0 Q 6,2 2,2 Q 0,2 -2,0 L 0,-12 Z" 
          fill="#000000" opacity="0.9" transform="rotate(120)"/>
    <!-- Tomoe 3 -->
    <path d="M 0,-12 Q 8,-12 10,-8 Q 12,-4 8,0 Q 6,2 2,2 Q 0,2 -2,0 L 0,-12 Z" 
          fill="#000000" opacity="0.9" transform="rotate(240)"/>
  </g>
  
  <!-- Purple accent rings (Rinnegan-inspired ripples) -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#a64dff" stroke-width="1" opacity="0.3"/>
  <circle cx="64" cy="64" r="26" fill="none" stroke="#a64dff" stroke-width="1" opacity="0.2"/>
</svg>
