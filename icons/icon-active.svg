<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Brighter purple gradient for active state -->
  <defs>
    <radialGradient id="purpleGradActive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c280ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b00b8;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="sharinganGradActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect for active state -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with glow -->
  <circle cx="64" cy="64" r="60" fill="url(#purpleGradActive)" stroke="#8b00e0" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Stylized eye/sharingan symbol -->
  <ellipse cx="64" cy="64" rx="35" ry="38" fill="#2d0052" opacity="0.7"/>
  
  <!-- Eye white -->
  <ellipse cx="64" cy="64" rx="28" ry="30" fill="#ffffff"/>
  
  <!-- Iris (brighter red for active Sharingan) -->
  <circle cx="64" cy="64" r="18" fill="url(#sharinganGradActive)"/>
  
  <!-- Pupil -->
  <circle cx="64" cy="64" r="8" fill="#000000"/>
  
  <!-- Sharingan tomoe (3 comma shapes) -->
  <g transform="translate(64, 64)">
    <!-- Tomoe 1 -->
    <path d="M 0,-12 Q 8,-12 10,-8 Q 12,-4 8,0 Q 6,2 2,2 Q 0,2 -2,0 L 0,-12 Z" 
          fill="#000000" opacity="0.9" transform="rotate(0)"/>
    <!-- Tomoe 2 -->
    <path d="M 0,-12 Q 8,-12 10,-8 Q 12,-4 8,0 Q 6,2 2,2 Q 0,2 -2,0 L 0,-12 Z" 
          fill="#000000" opacity="0.9" transform="rotate(120)"/>
    <!-- Tomoe 3 -->
    <path d="M 0,-12 Q 8,-12 10,-8 Q 12,-4 8,0 Q 6,2 2,2 Q 0,2 -2,0 L 0,-12 Z" 
          fill="#000000" opacity="0.9" transform="rotate(240)"/>
  </g>
  
  <!-- Brighter purple accent rings (Rinnegan-inspired ripples) for active state -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#e0b3ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="64" cy="64" r="26" fill="none" stroke="#e0b3ff" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Active indicator dot -->
  <circle cx="100" cy="28" r="10" fill="#00ff00" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
</svg>
