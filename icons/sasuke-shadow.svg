<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sasuke shadow silhouette with Sharingan and Rinnegan eyes -->
  <defs>
    <!-- Gradient for shadow effect -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.5" />
    </linearGradient>
    
    <!-- Sharingan gradient (left eye) -->
    <radialGradient id="sharinganEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6666;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Rinnegan gradient (right eye) - purple with ripples -->
    <radialGradient id="rinneganEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c280ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b00e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a0075;stop-opacity:1" />
    </radialGradient>
    
    <!-- Glow effect for eyes -->
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="800" height="1200" fill="none"/>
  
  <!-- Sasuke silhouette - stylized shadow figure -->
  <!-- Head -->
  <ellipse cx="400" cy="250" rx="100" ry="120" fill="url(#shadowGrad)" opacity="0.8"/>
  
  <!-- Hair spikes (characteristic Sasuke hair) -->
  <path d="M 350,180 L 320,120 L 340,160 Z" fill="url(#shadowGrad)" opacity="0.8"/>
  <path d="M 380,160 L 370,100 L 385,145 Z" fill="url(#shadowGrad)" opacity="0.8"/>
  <path d="M 420,160 L 430,100 L 415,145 Z" fill="url(#shadowGrad)" opacity="0.8"/>
  <path d="M 450,180 L 480,120 L 460,160 Z" fill="url(#shadowGrad)" opacity="0.8"/>
  <path d="M 320,240 L 280,200 L 310,230 Z" fill="url(#shadowGrad)" opacity="0.8"/>
  <path d="M 480,240 L 520,200 L 490,230 Z" fill="url(#shadowGrad)" opacity="0.8"/>
  
  <!-- Neck -->
  <rect x="375" y="350" width="50" height="40" fill="url(#shadowGrad)" opacity="0.8"/>
  
  <!-- Shoulders and upper body -->
  <ellipse cx="400" cy="480" rx="150" ry="130" fill="url(#shadowGrad)" opacity="0.7"/>
  
  <!-- Arms extended (characteristic Sasuke pose) -->
  <ellipse cx="250" cy="550" rx="40" ry="180" fill="url(#shadowGrad)" opacity="0.7" transform="rotate(-20 250 550)"/>
  <ellipse cx="550" cy="550" rx="40" ry="180" fill="url(#shadowGrad)" opacity="0.7" transform="rotate(20 550 550)"/>
  
  <!-- Torso extension -->
  <rect x="330" y="580" width="140" height="200" fill="url(#shadowGrad)" opacity="0.6"/>
  
  <!-- Lower body -->
  <ellipse cx="370" cy="850" rx="50" ry="200" fill="url(#shadowGrad)" opacity="0.6"/>
  <ellipse cx="430" cy="850" rx="50" ry="200" fill="url(#shadowGrad)" opacity="0.6"/>
  
  <!-- Cloak/cape effect -->
  <path d="M 250,450 Q 150,700 200,1100 L 250,1100 L 280,500 Z" fill="url(#shadowGrad)" opacity="0.4"/>
  <path d="M 550,450 Q 650,700 600,1100 L 550,1100 L 520,500 Z" fill="url(#shadowGrad)" opacity="0.4"/>
  
  <!-- LEFT EYE - SHARINGAN (red with tomoe) -->
  <g filter="url(#eyeGlow)">
    <!-- Eye socket -->
    <ellipse cx="360" cy="240" rx="28" ry="32" fill="#000000"/>
    <!-- Eye white -->
    <ellipse cx="360" cy="240" rx="24" ry="28" fill="#ffffff" opacity="0.9"/>
    <!-- Iris -->
    <circle cx="360" cy="240" r="18" fill="url(#sharinganEye)"/>
    <!-- Pupil -->
    <circle cx="360" cy="240" r="6" fill="#000000"/>
    
    <!-- Sharingan tomoe (3 comma patterns) -->
    <g transform="translate(360, 240)">
      <path d="M 0,-10 Q 6,-10 8,-7 Q 10,-4 6,0 Q 4,1 1,1 Q 0,1 -1,0 L 0,-10 Z" 
            fill="#000000" opacity="0.8" transform="rotate(0)"/>
      <path d="M 0,-10 Q 6,-10 8,-7 Q 10,-4 6,0 Q 4,1 1,1 Q 0,1 -1,0 L 0,-10 Z" 
            fill="#000000" opacity="0.8" transform="rotate(120)"/>
      <path d="M 0,-10 Q 6,-10 8,-7 Q 10,-4 6,0 Q 4,1 1,1 Q 0,1 -1,0 L 0,-10 Z" 
            fill="#000000" opacity="0.8" transform="rotate(240)"/>
    </g>
  </g>
  
  <!-- RIGHT EYE - RINNEGAN (purple with ripple pattern) -->
  <g filter="url(#eyeGlow)">
    <!-- Eye socket -->
    <ellipse cx="440" cy="240" rx="28" ry="32" fill="#000000"/>
    <!-- Eye white -->
    <ellipse cx="440" cy="240" rx="24" ry="28" fill="#ffffff" opacity="0.9"/>
    <!-- Iris -->
    <circle cx="440" cy="240" r="18" fill="url(#rinneganEye)"/>
    <!-- Pupil -->
    <circle cx="440" cy="240" r="5" fill="#000000"/>
    
    <!-- Rinnegan ripple pattern (concentric circles) -->
    <circle cx="440" cy="240" r="15" fill="none" stroke="#1a0033" stroke-width="1.5" opacity="0.8"/>
    <circle cx="440" cy="240" r="12" fill="none" stroke="#1a0033" stroke-width="1.5" opacity="0.8"/>
    <circle cx="440" cy="240" r="9" fill="none" stroke="#1a0033" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Rinnegan tomoe (6 dots around the pupil) -->
    <circle cx="440" cy="228" r="2" fill="#000000"/>
    <circle cx="450" cy="234" r="2" fill="#000000"/>
    <circle cx="450" cy="246" r="2" fill="#000000"/>
    <circle cx="440" cy="252" r="2" fill="#000000"/>
    <circle cx="430" cy="246" r="2" fill="#000000"/>
    <circle cx="430" cy="234" r="2" fill="#000000"/>
  </g>
  
  <!-- Additional shadow details - clothing symbols -->
  <circle cx="400" cy="480" r="15" fill="none" stroke="#400070" stroke-width="2" opacity="0.5"/>
  <path d="M 400,470 L 400,490 M 390,480 L 410,480" stroke="#400070" stroke-width="2" opacity="0.5"/>
</svg>
